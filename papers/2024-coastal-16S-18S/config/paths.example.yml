# Public path template. Replace only these placeholders in a local copy.
project_root: /your/data/
analysis_root: /your/data/analysis/
output_root: /outfile/

# Executables are resolved from PATH by default; set explicit paths only when needed.
rscript: Rscript
python: python
seqkit: seqkit
vsearch: vsearch
usearch12: /your/data/tools/usearch12

# External inputs are not redistributed with this repository.
raw_16s_fastq_dir: /your/data/raw/16S/
raw_18s_fastq_dir: /your/data/raw/18S/
pr2_utax_database: /your/data/references/PR2_v5.1.1_utax.fasta.gz
silva_18s_database: /your/data/references/SILVA_138.2_18S.fa
rdp_16s_database: /your/data/references/RDP_16S_v18.fa
faprotax_script: /your/data/external/FAPROTAX/collapse_table.py
faprotax_database: /your/data/external/FAPROTAX/FAPROTAX.txt

# Taxonomy contract used by the final analysis.
taxonomy_16s_primary: RDP 16S v18 via SINTAX
taxonomy_18s_primary: PR2 v5.1.1
taxonomy_18s_reference_chimera_screen: SILVA 138.2 only
# DADA2 was not executed in this study and is intentionally absent.
